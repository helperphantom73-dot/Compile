name: Cyber Compiler Multi-Target Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libomp-dev
        pip install llvmlite

    - name: Run Axon Compiler (Generates CPU, GPU, TPU, JIT)
      run: python3 axon_bundle.py

    - name: Upload All Outputs (CPU Bin, GPU PTX, TPU HLO)
      uses: actions/upload-artifact@v4
      with:
        name: axon-cyber-artifacts
        path: |
          model.bin
          model.ptx
          model.hlo
          *.dot
