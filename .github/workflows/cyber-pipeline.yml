name: Cyber Compiler Multi-Target Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # برای اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 دریافت کدهای مخزن
      uses: actions/checkout@v4
      
    - name: 🐍 نصب پایتون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 🛠️ نصب پیش‌نیازهای لینوکس (GCC, OpenMP)
      run: |
        sudo apt-get update 
        sudo apt-get install -y build-essential libomp-dev
        
    - name: 📦 نصب llvmlite
      run: |
        python -m pip install --upgrade pip
        pip install llvmlite

    - name: 🚀 اجرای کامپایلر Axon (تولید CPU, GPU, TPU, JIT)
      run: python3 axon_bundle.py

    - name: 📤 آپلود خروجی‌ها (باینری CPU، فایل PTX کارت گرافیک، فایل HLO گوگل)
      uses: actions/upload-artifact@v4
      with:
        name: axon-cyber-artifacts
        path: |
          model.bin
          model.ptx
          model.hlo
          *.dot
