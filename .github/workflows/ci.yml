name: Axon v12.0 Final Universal (Free & Pro + Studio + Mobile SDK)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-v12-linux-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Toolchain, OpenCL (PoCL), Verilog & llvmlite
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make iverilog ocl-icd-opencl-dev pocl-opencl-icd clinfo
          python3 -m pip install --upgrade pip
          python3 -m pip install "llvmlite>=0.40,<0.45"

      - name: Auto-Patch & Build Axon v12.0 (Free + Pro Studio + Tests + Android SDK)
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 - <<'PY'
          import py_compile
          p = "axon_v12_studio.py"
          s = open(p, encoding="utf-8").read()
          reps = [
              ("JNI_BRIDGE_C = r'''", 'JNI_BRIDGE_C = r"""'),
              ("#endif\n'''", '#endif\n"""'),
              ("KOTLIN_KT = r'''", 'KOTLIN_KT = r"""'),
              ("external fun matmul(a: FloatArray, b: FloatArray, m: Int, k: Int, n: Int): FloatArray\n}\n'''",
               'external fun matmul(a: FloatArray, b: FloatArray, m: Int, k: Int, n: Int): FloatArray\n}\n"""'),
              ("SWIFT_WRAP = r'''", 'SWIFT_WRAP = r"""'),
              ("return Array(UnsafeBufferPointer(start: ptr, count: Int(rows * cols)))\n    }\n}\n'''",
               'return Array(UnsafeBufferPointer(start: ptr, count: Int(rows * cols)))\n    }\n}\n"""'),
              ('os.environ.get("ANDROID_NDK_ROOT", ""),',
               'os.environ.get("ANDROID_NDK_ROOT", ""),\n        os.environ.get("ANDROID_NDK_LATEST_HOME", ""),'),
              ('            if (use_brain && cw->reg_data && cw->ndim == 2 && !use_gpu) {\n'
               '                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n'
               '            } else if (use_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (use_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {\n'
               '                t->dtype = AXON_DTYPE_TERNARY; t->data = cw->tern_buf; t->scale = cw->tern_scale; t->owns_data = false; w_mem += cw->tern_len + 8;\n'
               '            } else {',
               '            int ok_mm_rhs = (cw->ndim == 2 && !use_gpu), ok_neuro = 0;\n'
               '            for (int u = 0; u < m->num_nodes; ++u) {\n'
               '                CNode *un = &m->nodes[u];\n'
               '                for (int k = 0; k < un->nin; ++k) if (un->inputs[k] == i) {\n'
               '                    if (un->op == 3 && k == 1) ok_neuro = 1;\n'
               '                    else if (!((un->op == 2 || un->op >= 18) && k == 1)) ok_mm_rhs = 0;\n'
               '                }\n'
               '            }\n'
               '            if (ok_neuro && use_fp4 && cw->fp4_buf) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (ok_mm_rhs && use_brain && cw->reg_data && !ok_neuro) {\n'
               '                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n'
               '            } else if (ok_mm_rhs && use_fp4 && cw->fp4_buf && !ok_neuro) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (ok_mm_rhs && use_tern && cw->tern_buf && !ok_neuro) {\n'
               '                t->dtype = AXON_DTYPE_TERNARY; t->data = cw->tern_buf; t->scale = cw->tern_scale; t->owns_data = false; w_mem += cw->tern_len + 8;\n'
               '            } else {'),
          ]
          for old, new in reps:
              s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          py_compile.compile(p, doraise=True)
          print("[ok] axon_v12_studio.py syntax verified")
          PY
          python3 axon_v12_studio.py
          python3 -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          python3 -m axon.cli build-mobile -o dist_mobile_android
          ls -lh dist_v12/ dist_mobile_android/

      - name: Verify Zero-Prerequisite Execution in Empty Temp Folder
        run: |
          mkdir -p /tmp/zero_req_free /tmp/zero_req_pro
          cp dist_v12/axon-studio /tmp/zero_req_free/
          cp dist_v12/axon-pro-studio /tmp/zero_req_pro/
          /tmp/zero_req_free/axon-studio --once
          /tmp/zero_req_pro/axon-pro-studio --once
          rm -rf /tmp/zero_req_free /tmp/zero_req_pro

      - name: Selfcheck, Sanitizer (ASan+UBSan) & Multi-Backend Benchmarks
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 -m axon.cli selfcheck
          make sanitize
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c11 -Iaxon/runtime axon/runtime/axon_studio.c axon/runtime/axon_runtime.c -ldl -lm -lpthread -o /tmp/studio_san
          /tmp/studio_san --once && rm -f /tmp/studio_san
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -m axon.cli autoconfig --no-tune
          python3 tests/bench_chart.py --require-opencl

      - name: Upload Axon Free (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-free-linux-x86_64
          if-no-files-found: warn
          path: |
            dist_v12/axon-studio
            dist_v12/mini_llm.axg1
            dist_v12/mini_llm.axn3

      - name: Upload Axon Pro (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-pro-linux-x86_64
          if-no-files-found: warn
          path: |
            dist_v12/axon-pro-studio
            dist_v12/mini_llm.axg1
            dist_v12/mini_llm.axn3
            bench_results.md
            bench_results.json

      - name: Upload Android NDK SDK (ARM64 .so + Kotlin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-android-sdk
          if-no-files-found: warn
          path: dist_mobile_android/

  build-v12-macos-ios-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure C Compiler & llvmlite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:/c/ProgramData/mingw64/mingw64/bin:/c/Strawberry/c/bin:$PATH"
            if ! command -v gcc >/dev/null 2>&1; then
              choco install mingw -y
              export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/bin:$PATH"
            fi
            echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"
            echo "/c/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi
          python -m pip install --upgrade pip
          python -m pip install "llvmlite>=0.40,<0.45"

      - name: Build & Verify Axon v12.0 on ${{ matrix.os }}
        shell: bash
        run: |
          python - <<'PY'
          import py_compile
          p = "axon_v12_studio.py"
          s = open(p, encoding="utf-8").read()
          reps = [
              ("JNI_BRIDGE_C = r'''", 'JNI_BRIDGE_C = r"""'),
              ("#endif\n'''", '#endif\n"""'),
              ("KOTLIN_KT = r'''", 'KOTLIN_KT = r"""'),
              ("external fun matmul(a: FloatArray, b: FloatArray, m: Int, k: Int, n: Int): FloatArray\n}\n'''",
               'external fun matmul(a: FloatArray, b: FloatArray, m: Int, k: Int, n: Int): FloatArray\n}\n"""'),
              ("SWIFT_WRAP = r'''", 'SWIFT_WRAP = r"""'),
              ("return Array(UnsafeBufferPointer(start: ptr, count: Int(rows * cols)))\n    }\n}\n'''",
               'return Array(UnsafeBufferPointer(start: ptr, count: Int(rows * cols)))\n    }\n}\n"""'),
              ('            if (use_brain && cw->reg_data && cw->ndim == 2 && !use_gpu) {\n'
               '                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n'
               '            } else if (use_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (use_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {\n'
               '                t->dtype = AXON_DTYPE_TERNARY; t->data = cw->tern_buf; t->scale = cw->tern_scale; t->owns_data = false; w_mem += cw->tern_len + 8;\n'
               '            } else {',
               '            int ok_mm_rhs = (cw->ndim == 2 && !use_gpu), ok_neuro = 0;\n'
               '            for (int u = 0; u < m->num_nodes; ++u) {\n'
               '                CNode *un = &m->nodes[u];\n'
               '                for (int k = 0; k < un->nin; ++k) if (un->inputs[k] == i) {\n'
               '                    if (un->op == 3 && k == 1) ok_neuro = 1;\n'
               '                    else if (!((un->op == 2 || un->op >= 18) && k == 1)) ok_mm_rhs = 0;\n'
               '                }\n'
               '            }\n'
               '            if (ok_neuro && use_fp4 && cw->fp4_buf) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (ok_mm_rhs && use_brain && cw->reg_data && !ok_neuro) {\n'
               '                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n'
               '            } else if (ok_mm_rhs && use_fp4 && cw->fp4_buf && !ok_neuro) {\n'
               '                t->dtype = AXON_DTYPE_FP4; t->data = cw->fp4_buf; t->owns_data = false; t->reserved = 0; w_mem += cw->fp4_len;\n'
               '            } else if (ok_mm_rhs && use_tern && cw->tern_buf && !ok_neuro) {\n'
               '                t->dtype = AXON_DTYPE_TERNARY; t->data = cw->tern_buf; t->scale = cw->tern_scale; t->owns_data = false; w_mem += cw->tern_len + 8;\n'
               '            } else {'),
          ]
          for old, new in reps:
              s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          py_compile.compile(p, doraise=True)
          print("[ok] axon_v12_studio.py syntax verified")
          PY
          python axon_v12_studio.py
          python -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist_v12/axon-studio.exe --once
            ./dist_v12/axon-pro-studio.exe --once
          else
            ./dist_v12/axon-studio --once
            ./dist_v12/axon-pro-studio --once
            python -m axon.cli build-mobile -o dist_mobile_ios
            ls -lh dist_mobile_ios/
          fi

      - name: Upload Axon Free (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-free-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-studio*
            dist_v12/mini_llm.*

      - name: Upload Axon Pro (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-pro-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-pro-studio*
            dist_v12/mini_llm.*

      - name: Upload iOS ARM64 SDK (.a + Swift)
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-ios-sdk
          if-no-files-found: warn
          path: dist_mobile_ios/