name: Axon v10.0 Universal Brain & Multi-Accelerator CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-verify-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Toolchain, OpenCL (PoCL), Verilog & llvmlite
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make iverilog ocl-icd-opencl-dev pocl-opencl-icd clinfo
          python3 -m pip install --upgrade pip
          python3 -m pip install "llvmlite>=0.40,<0.45"
          clinfo || true

      - name: Unpack & Build Axon v10.0
        run: |
          python3 axon_bundle.py

      - name: Full Selfcheck (Unit Tests + TPU MLIR Validator + OpenCL + Verilog RTL)
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 -m axon.cli selfcheck

      - name: Build Multi-Target v10.0 Binaries & Accelerators
        run: |
          python3 -m axon.cli build examples/transformer_block.axon -o transformer.bin
          python3 -m axon.cli build examples/transformer_block.axon -o transformer_brain.bin --brain --external-weights
          python3 -m axon.cli build examples/llama_block.axon -o llama_block.bin --external-weights
          python3 -m axon.cli build examples/llama_block.axon -o llama_block.so --emit-shared --external-weights
          python3 -m axon.cli build examples/mini_llm.axon -o mini_llm.bin --brain --external-weights
          ./mini_llm.bin --generate 8
          python3 -m axon.cli build examples/transformer_block.axon -o transformer_gpu.bin --target gpu
          ./transformer_gpu.bin --iters 20
          python3 -m axon.cli build examples/mini_llm.axon -o mini_llm_gpu.bin --target gpu
          ./mini_llm_gpu.bin --generate 4
          python3 -m axon.cli build examples/transformer_block.axon -o transformer_tpu.mlir --target tpu
          python3 -m axon.cli build examples/llama_block.axon -o llama_tpu.mlir --target tpu
          python3 -m axon.cli build examples/mini_llm.axon -o mini_llm_tpu.mlir --target tpu
          python3 -m axon.cli build examples/transformer_block.axon -o axon_chip.v --emit-silicon

      - name: Run ASan + UBSan Sanitizer Suite
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          make sanitize
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -c "from axon.runtime_paths import ensure_runtime; ensure_runtime(verbose=True)"

      - name: Run v10.0 Multi-Backend Benchmarks & Step Summary Chart
        run: |
          python3 tests/bench_chart.py --require-opencl
          for b in ./transformer.bin ./transformer_brain.bin ./llama_block.bin ./mini_llm.bin ./transformer_gpu.bin; do
            if [ -x "$b" ]; then
              echo "=== Benchmark $b ==="
              "$b" --iters 50
            fi
          done
          if [ -f ./llama_block_client.py ]; then
            echo "=== Benchmark llama_block.so via Python FFI Client ==="
            python3 -c "import time; from llama_block_client import AxonModel; m=AxonModel(); t0=time.perf_counter(); [m.infer([1,2,3,4,1,2,3,4]) for _ in range(100)]; print(f'100 iters avg {(time.perf_counter()-t0)*1e4:.2f} us'); m.close()"
          fi

      - name: Upload Clean v10.0 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v10-universal-release
          if-no-files-found: warn
          path: |
            transformer.bin
            transformer_brain.bin
            transformer_brain.bin.axn3
            transformer_gpu.bin
            transformer_gpu.bin.cl
            transformer_tpu.mlir
            llama_block.bin
            llama_block.bin.axn3
            llama_block.so
            llama_block.so.axn3
            llama_block_client.py
            llama_tpu.mlir
            mini_llm.bin
            mini_llm.bin.axn3
            mini_llm_gpu.bin
            mini_llm_tpu.mlir
            axon_chip.v
            axon_chip_tb.v
            axon_chip_weights.hex
            bench_results.md
            bench_results.json