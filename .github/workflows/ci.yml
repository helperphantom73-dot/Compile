name: Axon v7.0 Multi-Mode Build & Verify

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-axon-v7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Fix Known Bugs in Bundle & Runtime
        run: |
          python3 - <<'PY'
          import glob, os, re

          targets = [p for p in glob.glob("*.py") + ["axon/backend.py", "axon/runtime/axon_runtime.c"] if os.path.isfile(p)]
          for path in targets:
              s = open(path, encoding="utf-8").read()
              orig = s
              s = re.sub(
                  r'(?<!self\.f_init=)\bfn=ir\.Function\(self\.mod,ir\.FunctionType\(self\.i32,\[\]\),"axon_init"\)',
                  r'self.f_init=fn=ir.Function(self.mod,ir.FunctionType(self.i32,[]),"axon_init")',
                  s,
              )
              s = s.replace('(K=%0d)', '(K=%%0d)')
              s = s.replace('tm=target.create_target_machine(opt=3)', "tm=target.create_target_machine(opt=3, reloc='pic')")
              old_wt = '    int64_t total=1; for(int64_t i=0;i<ent.ndim;++i){ if(ent.shape[i]<=0)return NULL; total*=ent.shape[i]; }'
              new_wt = '    int64_t shp[AXON_MAX_DIMS]={0}; memcpy(shp,ent.shape,sizeof(shp)); int64_t nd=(int64_t)ent.ndim;\n    int64_t total=1; for(int64_t i=0;i<nd;++i){ if(shp[i]<=0)return NULL; total*=shp[i]; }'
              if old_wt in s:
                  s = s.replace(old_wt, new_wt)
                  s = s.replace('tensor_view_new(ent.ndim,ent.shape,', 'tensor_view_new(nd,shp,')
                  s = s.replace('int sorted=(ent.ndim==2)?1:0;', 'int sorted=(nd==2)?1:0;')
                  s = s.replace('int64_t N=ent.shape[1]', 'int64_t N=shp[1]')
              if s != orig:
                  open(path, "w", encoding="utf-8").write(s)
                  print(f"[auto-fix] patched {path}")
          PY

      - name: Setup Python 3.11 (primary)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools (with fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make || true
          sudo apt-get install -y clang || echo "[warn] clang unavailable, using gcc"
          sudo apt-get install -y iverilog || echo "[warn] iverilog unavailable, RTL sim will be skipped"

      - name: Install llvmlite (Multi-Mode Fallback)
        id: llvm_deps
        run: |
          python3 -m pip install --upgrade pip
          if python3 -m pip install "llvmlite>=0.40,<0.45"; then
            echo "llvm_ok=true" >> "$GITHUB_OUTPUT"
          elif python3 -m pip install --only-binary=:all: llvmlite; then
            echo "llvm_ok=true" >> "$GITHUB_OUTPUT"
          else
            sudo apt-get install -y llvm-dev || true
            if python3 -m pip install llvmlite; then
              echo "llvm_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "llvm_ok=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Unpack & Compile Axon v7.0 (Mode A -> Mode B -> Mode C)
        run: |
          BUNDLE=""
          for f in axon_bundle.py axon_v7.py bundle.py; do
            if [ -f "$f" ]; then BUNDLE="$f"; break; fi
          done

          run_build() {
            local compiler="$1"
            local native="$2"
            echo "[try] CC=$compiler AXON_NATIVE=$native"
            rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
            export CC="$compiler"
            export AXON_NATIVE="$native"
            if [ -n "$BUNDLE" ]; then
              python3 "$BUNDLE"
            else
              python3 -m axon.cli build examples/transformer_block.axon -o transformer.bin
              python3 -m axon.cli build examples/transformer_block.axon -o transformer_brain.bin --brain --external-weights
              python3 -m axon.cli build examples/transformer_block.axon -o transformer_ternary.bin --ternary
              python3 -m axon.cli build examples/mlp.axon -o mlp.bin --no-quant
              python3 -m axon.cli build examples/transformer_block.axon -o axon_chip.v --emit-silicon
            fi
          }

          if [ "${{ steps.llvm_deps.outputs.llvm_ok }}" = "true" ]; then
            if run_build gcc 0; then
              echo "[ok] Mode 1 (GCC) succeeded"
            elif command -v clang >/dev/null 2>&1 && run_build clang 0; then
              echo "[ok] Mode 2 (Clang fallback) succeeded"
            else
              echo "[fallback] Mode 3: building runtime directly without OpenMP..."
              mkdir -p axon/runtime
              rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
              cc -O3 -fPIC -std=c11 -pthread -c axon/runtime/axon_runtime.c -o axon/runtime/axon_runtime.o
              cc -O3 -fPIC -std=c11 -pthread -c axon/runtime/axon_main.c -o axon/runtime/axon_main.o
              ar rcs axon/runtime/libaxon_runtime.a axon/runtime/axon_runtime.o
              cc -O3 -shared axon/runtime/axon_runtime.o -lm -pthread -o axon/runtime/libaxon_runtime.so
              touch axon/runtime/.axon_tuning_stamp
              python3 -m axon.cli build examples/transformer_block.axon -o transformer.bin
              python3 -m axon.cli build examples/transformer_block.axon -o transformer_brain.bin --brain --external-weights
            fi
          else
            echo "[fallback] Mode 4: Pure C Runtime compilation without llvmlite"
            if [ -n "$BUNDLE" ]; then
              python3 -c '
              import os
              ns = {}
              src = open("'"$BUNDLE"'", encoding="utf-8").read().split("def main():")[0]
              exec(src, ns)
              for p, c in ns["FILES"].items():
                  if os.path.dirname(p): os.makedirs(os.path.dirname(p), exist_ok=True)
                  if p.endswith("Makefile"): c = c.replace("@@", "\t")
                  open(p, "w", encoding="utf-8").write(c)
              '
            fi
            cc -O3 -fPIC -std=c11 -pthread -Iaxon/runtime -c axon/runtime/axon_runtime.c -o axon/runtime/axon_runtime.o
            ar rcs axon/runtime/libaxon_runtime.a axon/runtime/axon_runtime.o
            cc -O3 -shared axon/runtime/axon_runtime.o -lm -pthread -o axon/runtime/libaxon_runtime.so
            cc -O2 -pthread -Iaxon/runtime tests/test_c_runtime.c axon/runtime/axon_runtime.c -lm -o test_c_runtime.bin
            ./test_c_runtime.bin
          fi

      - name: Verify Selfcheck & Sanitizer (with fallback)
        run: |
          if [ "${{ steps.llvm_deps.outputs.llvm_ok }}" = "true" ]; then
            python3 -m axon.cli selfcheck || python3 -m unittest discover -s tests -p "test_*.py" -v
          fi

          if make sanitize; then
            echo "[ok] make sanitize (ASan+UBSan) passed"
          else
            echo "[fallback] running direct C ASan+UBSan check..."
            cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
               -Iaxon/runtime tests/test_c_runtime.c axon/runtime/axon_runtime.c -lm -o /tmp/axon_c_san
            /tmp/axon_c_san
            rm -f /tmp/axon_c_san
          fi
          make clean && make runtime || true

      - name: Run Binary Smoke Benchmark
        run: |
          for b in ./transformer.bin ./transformer_brain.bin ./transformer_ternary.bin ./mlp.bin; do
            if [ -x "$b" ]; then
              echo "=== Testing $b ==="
              "$b" --iters 50
            fi
          done

      - name: Upload Compiled Binaries & Weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v7-binaries
          if-no-files-found: warn
          path: |
            transformer.bin
            transformer_brain.bin
            transformer_brain.bin.axn3
            transformer_ternary.bin
            mlp.bin
            axon_chip.v
            axon_chip_tb.v
            axon_chip_weights.hex
            test_c_runtime.bin
            axon/runtime/libaxon_runtime.a
            axo
