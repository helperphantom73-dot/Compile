              from axon.backend import LLVMBackend, Linker
              rt = ensure_runtime()
              src_mlp = open("examples/mlp.axon", encoding="utf-8").read()
              ast = Parser(Lexer(src_mlp).tokenize()).parse(); Semantic().analyze(ast)
              g_test = Pipeline(quant=False).run(IRBuilder().build(ast))
              chosen_triple = None
              logs = []
              with tempfile.TemporaryDirectory() as td:
                  csrc = os.path.join(td, "t.c")
                  wstub = os.path.join(td, "ws.c")
                  open(wstub, "w").write('#include <stdint.h>\nvoid axon_weights_get(const void**p,int64_t*n){*p=0;*n=0;}\n')
                  open(csrc, "w").write('#include <stdio.h>\n#include <stdint.h>\nint64_t axon_get_input_ndim(void);\nvoid axon_get_input_shape(int64_t*);\nint main(void){ int64_t s[4]={0}; int64_t nd=axon_get_input_ndim(); axon_get_input_shape(s); printf("nd=%lld s=%lld,%lld\\n",(long long)nd,(long long)s[0],(long long)s[1]); return !(nd==2 && s[0]==1 && s[1]==4); }\n')
                  for cand in ("x86_64-w64-windows-gnu", llvm.get_default_triple()):
                      try:
                          o = os.path.join(td, "m.o"); e = os.path.join(td, "t.exe")
                          LLVMBackend(target_triple=cand).compile(g_test, o)
                          od = subprocess.run(["objdump", "-d", o], capture_output=True, text=True).stdout
                          idx = od.find("<axon_get_input_shape>")
                          snip = od[idx:idx+320] if idx >= 0 else od[-400:]
                          Linker.link([o, csrc, wstub], e, static_rt=str(rt.static_lib))
                          rr = subprocess.run([e], capture_output=True, text=True)
                          logs.append(f"TRIPLE={cand} rc={rr.returncode} out={rr.stdout.strip()} err={rr.stderr.strip()}\n{snip}")
                          if rr.returncode == 0 and chosen_triple is None:
                              chosen_triple = cand
                              break
                      except Exception as ex:
                          logs.append(f"TRIPLE={cand} EXC={ex}")
              if not chosen_triple:
                  print("\n".join(logs))
                  sys.exit(1)
              print(f"[win-diag] SELECTED: {chosen_triple}")
              bs = bs.replace("self.triple=target_triple or _default_llvm_triple();", f"self.triple=target_triple or {chosen_triple!r};")
              open(bi, "w", encoding="utf-8").write(bs)

          for fp in ("tests/test_axon.py", "axon/cli.py", "tests/bench_chart.py"):
              txt = open(fp, encoding="utf-8").read()
              txt = txt.replace(
                  "ctypes.CDLL(str(rt.shared_lib))",
                  '(ctypes.CDLL(str(rt.shared_lib), winmode=0) if os.name=="nt" else ctypes.CDLL(str(rt.shared_lib)))',
              )
              open(fp, "w", encoding="utf-8").write(txt)

          if os.path.exists("axon/runtime/.axon_tuning_stamp"):
              os.remove("axon/runtime/.axon_tuning_stamp")
          PY
          python axon_v12_studio.py
          python -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist_v12/axon-studio.exe --once
            ./dist_v12/axon-studio.exe --axg dist_v12/mini_llm.axg1 --axn dist_v12/mini_llm.axn3 --once
            ./dist_v12/axon-pro-studio.exe --once
            ./dist_v12/axon-pro-studio.exe --axg dist_v12/mini_llm.axg1 --axn dist_v12/mini_llm.axn3 --once
          else
            ./dist_v12/axon-studio --once
            ./dist_v12/axon-studio --axg dist_v12/mini_llm.axg1 --axn dist_v12/mini_llm.axn3 --once
            ./dist_v12/axon-pro-studio --once
            ./dist_v12/axon-pro-studio --axg dist_v12/mini_llm.axg1 --axn dist_v12/mini_llm.axn3 --once
            python -m axon.cli build-mobile -o dist_mobile_ios
            ls -lh dist_mobile_ios/
          fi

      - name: Upload Axon Free (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-free-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-studio*
            dist_v12/mini_llm.*

      - name: Upload Axon Pro (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-pro-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-pro-studio*
            dist_v12/mini_llm.*

      - name: Upload iOS ARM64 SDK (.a + Swift)
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-ios-sdk
          if-no-files-found: warn
          path: dist_mobile_ios/