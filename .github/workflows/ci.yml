name: Axon v12.0 Final Universal (Free & Pro + Studio + Mobile SDK)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-v12-linux-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Toolchain, OpenCL (PoCL), Verilog & llvmlite
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make iverilog ocl-icd-opencl-dev pocl-opencl-icd clinfo
          python3 -m pip install --upgrade pip
          python3 -m pip install "llvmlite>=0.40,<0.45"

      - name: Patch & Build Axon v12.0 (Free + Pro Standalone Studio + Tests)
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 - <<'PY'
          p = "axon_v12_studio.py"
          s = open(p, encoding="utf-8").read()
          for a, b in (
              ("JNI_BRIDGE_C = r'''", 'JNI_BRIDGE_C = r"""'),
              ("#endif\n'''\n\nKOTLIN_KT = r'''", '#endif\n"""\n\nKOTLIN_KT = r"""'),
              ("}\n'''\n\nSWIFT_WRAP = r'''", '}\n"""\n\nSWIFT_WRAP = r"""'),
              ("    }\n}\n'''\n\n\ndef _find_android_cc():", '    }\n}\n"""\n\n\ndef _find_android_cc():'),
              ("SN(11,15,2,4,8,3,5,8,10);", "SN(11,15,2,4,8,3,5,8,10,NULL);"),
              ('\'    sp.add_parser("doctor")\'', '\'    pi=sp.add_parser("inspect")\''),
              ("uint8_t hdr[56]; if (fread(hdr, 1, 56, fg) != 56", "uint8_t hdr[60]; if (fread(hdr, 1, 60, fg) != 60"),
              ("float *reg_data; float *sig_data; int64_t R, keep;\n} CWeight;", "float *reg_data; float *sig_data; int64_t R, keep;\n    int native_dtype;\n} CWeight;"),
              (
                  "if (cn->op == 1 && cn->weight[0]) {\n"
                  "            AxonTensor *wt = axon_weight_tensor(cn->weight);\n"
                  "            if (wt) {\n"
                  "                int64_t tot = axon_tensor_numel(wt);\n"
                  "                float *tmp = (float*)malloc((size_t)tot * sizeof(float));\n"
                  "                if (tmp && axon_tensor_to_f32(wt, tmp, tot) == AXON_OK) add_weight(m, cn->weight, (int)wt->ndim, wt->shape, tmp);\n"
                  "                free(tmp); axon_tensor_free(wt);\n"
                  "            }\n"
                  "        }",
                  "if (cn->op == 1 && cn->weight[0] && !find_cweight(m, cn->weight)) {\n"
                  "            AxonTensor *wt = axon_weight_tensor(cn->weight);\n"
                  "            if (wt) {\n"
                  "                int64_t tot = axon_tensor_numel(wt);\n"
                  "                float *tmp = (float*)malloc((size_t)tot * sizeof(float));\n"
                  "                if (tmp && axon_tensor_to_f32(wt, tmp, tot) == AXON_OK) {\n"
                  "                    add_weight(m, cn->weight, (int)wt->ndim, wt->shape, tmp);\n"
                  "                    m->weights[m->num_weights - 1].native_dtype = (int)wt->dtype;\n"
                  "                }\n"
                  "                free(tmp); axon_tensor_free(wt);\n"
                  "            }\n"
                  "        }",
              ),
              (
                  "if (use_brain && cw->reg_data && cw->ndim == 2 && !use_gpu) {\n"
                  "                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n"
                  "            } else if (use_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {",
                  "int is_axg = (strcmp(m->format, \"axg1+axn3\") == 0);\n"
                  "            int want_fp4 = is_axg ? (cw->native_dtype == AXON_DTYPE_FP4) : use_fp4;\n"
                  "            int want_tern = is_axg ? (cw->native_dtype == AXON_DTYPE_TERNARY) : use_tern;\n"
                  "            if (want_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {",
              ),
              ("} else if (use_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {", "} else if (want_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {"),
          ):
              s = s.replace(a, b)
          open(p, "w", encoding="utf-8").write(s)

          ns = {}
          exec(open(p, encoding="utf-8").read().split("def main():")[0], ns)
          ns["ensure_v11_base"]()

          # Cross-OS IEEE-754 & shared-lib .axn3 fixes
          rp = "axon/runtime_paths.py"
          open(rp, "w", encoding="utf-8").write(open(rp, encoding="utf-8").read().replace('"-fno-math-errno"]', '"-fno-math-errno", "-ffp-contract=off"]'))
          bi = "axon/backend/__init__.py"
          bs = open(bi, encoding="utf-8").read()
          bs = bs.replace('"-fno-math-errno"', '"-fno-math-errno","-ffp-contract=off"')
          bs = bs.replace(
              'ax_t=(output if output.endswith(".so") else output+".so")+".axn3" if emit_shared else output+".axn3"',
              'sh_e=".dll" if os.name=="nt" else (".dylib" if sys.platform=="darwin" else ".so"); ax_t=(output if output.endswith((".so",".dll",".dylib")) else output+sh_e)+".axn3" if emit_shared else output+".axn3"',
          )
          bs = bs.replace(
              "tm=target.create_target_machine(opt=3, reloc='default' if ('windows' in self.triple or 'mingw' in self.triple) else 'pic')\n        with open(out_obj,\"wb\") as f: f.write(tm.emit_object(parsed))",
              "tm=target.create_target_machine(opt=3, reloc='default' if ('windows' in self.triple or 'mingw' in self.triple) else 'pic')\n        parsed.data_layout=str(tm.target_data)\n        with open(out_obj,\"wb\") as f: f.write(tm.emit_object(parsed))",
          )
          open(bi, "w", encoding="utf-8").write(bs)
          if os.path.exists("axon/runtime/.axon_tuning_stamp"):
              os.remove("axon/runtime/.axon_tuning_stamp")
          PY
          python3 axon_v12_studio.py
          python3 -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          python3 -m axon.cli build-mobile -o dist_mobile_android
          ls -lh dist_v12/ dist_mobile_android/

      - name: Verify Zero-Prerequisite Execution in Empty Temp Folder (No Python/LLVM needed)
        run: |
          mkdir -p /tmp/zero_req_free /tmp/zero_req_pro
          cp dist_v12/axon-studio /tmp/zero_req_free/
          cp dist_v12/axon-pro-studio /tmp/zero_req_pro/
          /tmp/zero_req_free/axon-studio --once
          /tmp/zero_req_pro/axon-pro-studio --once
          rm -rf /tmp/zero_req_free /tmp/zero_req_pro

      - name: Selfcheck, Sanitizer (ASan+UBSan) & Multi-Backend Benchmarks
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 -m axon.cli selfcheck
          make sanitize
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -m axon.cli autoconfig --no-tune
          python3 tests/bench_chart.py --require-opencl

      - name: Upload Axon Free (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-free-linux-x86_64
          if-no-files-found: warn
          path: |
            dist_v12/axon-studio
            dist_v12/mini_llm.axg1
            dist_v12/mini_llm.axn3

      - name: Upload Axon Pro (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-pro-linux-x86_64
          if-no-files-found: warn
          path: |
            dist_v12/axon-pro-studio
            dist_v12/mini_llm.axg1
            dist_v12/mini_llm.axn3
            bench_results.md
            bench_results.json

      - name: Upload Android NDK SDK (ARM64 .so + Kotlin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-android-sdk
          if-no-files-found: warn
          path: dist_mobile_android/

  build-v12-macos-ios-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure C Compiler & llvmlite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:/c/ProgramData/mingw64/mingw64/bin:/c/Strawberry/c/bin:$PATH"
            if ! command -v gcc >/dev/null 2>&1; then
              choco install mingw -y
              export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/bin:$PATH"
            fi
            echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"
            echo "/c/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi
          python -m pip install --upgrade pip
          python -m pip install "llvmlite>=0.40,<0.45"

      - name: Patch, Build & Verify Axon v12.0 on ${{ matrix.os }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          p = "axon_v12_studio.py"
          s = open(p, encoding="utf-8").read()
          for a, b in (
              ("JNI_BRIDGE_C = r'''", 'JNI_BRIDGE_C = r"""'),
              ("#endif\n'''\n\nKOTLIN_KT = r'''", '#endif\n"""\n\nKOTLIN_KT = r"""'),
              ("}\n'''\n\nSWIFT_WRAP = r'''", '}\n"""\n\nSWIFT_WRAP = r"""'),
              ("    }\n}\n'''\n\n\ndef _find_android_cc():", '    }\n}\n"""\n\n\ndef _find_android_cc():'),
              ("SN(11,15,2,4,8,3,5,8,10);", "SN(11,15,2,4,8,3,5,8,10,NULL);"),
              ('\'    sp.add_parser("doctor")\'', '\'    pi=sp.add_parser("inspect")\''),
              ("uint8_t hdr[56]; if (fread(hdr, 1, 56, fg) != 56", "uint8_t hdr[60]; if (fread(hdr, 1, 60, fg) != 60"),
              ("float *reg_data; float *sig_data; int64_t R, keep;\n} CWeight;", "float *reg_data; float *sig_data; int64_t R, keep;\n    int native_dtype;\n} CWeight;"),
              (
                  "if (cn->op == 1 && cn->weight[0]) {\n"
                  "            AxonTensor *wt = axon_weight_tensor(cn->weight);\n"
                  "            if (wt) {\n"
                  "                int64_t tot = axon_tensor_numel(wt);\n"
                  "                float *tmp = (float*)malloc((size_t)tot * sizeof(float));\n"
                  "                if (tmp && axon_tensor_to_f32(wt, tmp, tot) == AXON_OK) add_weight(m, cn->weight, (int)wt->ndim, wt->shape, tmp);\n"
                  "                free(tmp); axon_tensor_free(wt);\n"
                  "            }\n"
                  "        }",
                  "if (cn->op == 1 && cn->weight[0] && !find_cweight(m, cn->weight)) {\n"
                  "            AxonTensor *wt = axon_weight_tensor(cn->weight);\n"
                  "            if (wt) {\n"
                  "                int64_t tot = axon_tensor_numel(wt);\n"
                  "                float *tmp = (float*)malloc((size_t)tot * sizeof(float));\n"
                  "                if (tmp && axon_tensor_to_f32(wt, tmp, tot) == AXON_OK) {\n"
                  "                    add_weight(m, cn->weight, (int)wt->ndim, wt->shape, tmp);\n"
                  "                    m->weights[m->num_weights - 1].native_dtype = (int)wt->dtype;\n"
                  "                }\n"
                  "                free(tmp); axon_tensor_free(wt);\n"
                  "            }\n"
                  "        }",
              ),
              (
                  "if (use_brain && cw->reg_data && cw->ndim == 2 && !use_gpu) {\n"
                  "                t->data = cw->reg_data; t->owns_data = false; w_mem += (size_t)cw->numel * 4;\n"
                  "            } else if (use_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {",
                  "int is_axg = (strcmp(m->format, \"axg1+axn3\") == 0);\n"
                  "            int want_fp4 = is_axg ? (cw->native_dtype == AXON_DTYPE_FP4) : use_fp4;\n"
                  "            int want_tern = is_axg ? (cw->native_dtype == AXON_DTYPE_TERNARY) : use_tern;\n"
                  "            if (want_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {",
              ),
              ("} else if (use_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {", "} else if (want_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {"),
          ):
              s = s.replace(a, b)
          open(p, "w", encoding="utf-8").write(s)

          ns = {}
          exec(open(p, encoding="utf-8").read().split("def main():")[0], ns)
          ns["ensure_v11_base"]()

          rp = "axon/runtime_paths.py"
          open(rp, "w", encoding="utf-8").write(open(rp, encoding="utf-8").read().replace('"-fno-math-errno"]', '"-fno-math-errno", "-ffp-contract=off"]'))
          bi = "axon/backend/__init__.py"
          bs = open(bi, encoding="utf-8").read()
          bs = bs.replace('"-fno-math-errno"', '"-fno-math-errno","-ffp-contract=off"')
          bs = bs.replace(
              'ax_t=(output if output.endswith(".so") else output+".so")+".axn3" if emit_shared else output+".axn3"',
              'sh_e=".dll" if os.name=="nt" else (".dylib" if sys.platform=="darwin" else ".so"); ax_t=(output if output.endswith((".so",".dll",".dylib")) else output+sh_e)+".axn3" if emit_shared else output+".axn3"',
          )
          bs = bs.replace(
              "tm=target.create_target_machine(opt=3, reloc='default' if ('windows' in self.triple or 'mingw' in self.triple) else 'pic')\n        with open(out_obj,\"wb\") as f: f.write(tm.emit_object(parsed))",
              "tm=target.create_target_machine(opt=3, reloc='default' if ('windows' in self.triple or 'mingw' in self.triple) else 'pic')\n        parsed.data_layout=str(tm.target_data)\n        with open(out_obj,\"wb\") as f: f.write(tm.emit_object(parsed))",
          )
          open(bi, "w", encoding="utf-8").write(bs)

          mc = "axon/runtime/axon_main.c"
          ms = open(mc, encoding="utf-8").read().replace(
              'fprintf(stderr,"input alloc failed\\n");',
              'fprintf(stderr,"input alloc failed (ndim=%lld shape=[%lld,%lld,%lld,%lld] need=%lld inp=%p)\\n",(long long)ndim,(long long)shape[0],(long long)shape[1],(long long)shape[2],(long long)shape[3],(long long)need,(void*)inp);',
          )
          open(mc, "w", encoding="utf-8").write(ms)
          if os.path.exists("axon/runtime/.axon_tuning_stamp"):
              os.remove("axon/runtime/.axon_tuning_stamp")
          PY
          python axon_v12_studio.py
          python -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist_v12/axon-studio.exe --once
            ./dist_v12/axon-pro-studio.exe --once
          else
            ./dist_v12/axon-studio --once
            ./dist_v12/axon-pro-studio --once
            python -m axon.cli build-mobile -o dist_mobile_ios
            ls -lh dist_mobile_ios/
          fi

      - name: Upload Axon Free (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-free-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-studio*
            dist_v12/mini_llm.*

      - name: Upload Axon Pro (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-pro-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist_v12/axon-pro-studio*
            dist_v12/mini_llm.*

      - name: Upload iOS ARM64 SDK (.a + Swift)
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v12-ios-sdk
          if-no-files-found: warn
          path: dist_mobile_ios/