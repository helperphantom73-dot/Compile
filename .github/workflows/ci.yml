               "if (ver != 1 || nn == 0 || nn > 4096 || in_i >= nn || out_i >= nn || in_nd == 0 || in_nd > 4 || nlen > 16777216u) { fclose(fg); return -1; }\n"
               "    size_t rsz = (size_t)nn * 72; uint8_t *rb = (uint8_t*)malloc(rsz); char *nb = (char*)malloc((size_t)nlen + 1);"),
