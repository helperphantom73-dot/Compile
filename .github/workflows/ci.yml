              'exe=os.path.join(tmp,"k")',
              'exe=os.path.join(tmp,"k.exe" if os.name=="nt" else "k")',
          )
          ts = ts.replace(
              '[os.environ.get("CC") or shutil.which("cc") or "cc",*Evolver._flags()',
