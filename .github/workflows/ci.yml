                  '''), "    ")
                  s = s.replace('if __name__=="__main__": unittest.main()', extra + 'if __name__=="__main__": unittest.main()')
              return s
          patch("tests/test_axon.py", up_tests)
          PY

      - name: Build Runtime, Run Tests & Build v8.0 Binaries
        run: |
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -c "from axon.runtime_paths import ensure_runtime; ensure_runtime(verbose=True)"
          if [ "${{ steps.deps.outputs.llvm_ok }}" = "true" ]; then
            python3 -m axon.cli selfcheck
            python3 -m axon.cli build examples/transformer_block.axon -o transformer.bin
            python3 -m axon.cli build examples/transformer_block.axon -o transformer_brain.bin --brain --external-weights
            python3 -m axon.cli build examples/llama_block.axon -o llama_block.bin --external-weights
            python3 -m axon.cli build examples/llama_block.axon -o llama_block.so --emit-shared --external-weights
          fi

      - name: Run ASan + UBSan Sanitizer Suite
        run: |
          make sanitize || {
            cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
               -Iaxon/runtime tests/test_c_runtime.c axon/runtime/axon_runtime.c -lm -o /tmp/axon_c_san
            /tmp/axon_c_san && rm -f /tmp/axon_c_san
          }
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -c "from axon.runtime_paths import ensure_runtime; ensure_runtime(verbose=True)"

      - name: Run v8.0 Benchmarks (Native Binary + Zero-PyTorch .so Client)
        run: |
          for b in ./transformer.bin ./transformer_brain.bin ./llama_block.bin; do
            if [ -x "$b" ]; then
              echo "=== Benchmark $b ==="
              "$b" --iters 100
            fi
          done
          if [ -f ./llama_block_client.py ]; then
            echo "=== Benchmark llama_block.so via Python FFI Client ==="
            python3 -c "import time; from llama_block_client import AxonModel; m=AxonModel(); t0=time.perf_counter(); [m.infer([1,2,3,4,1,2,3,4]) for _ in range(100)]; print(f'100 iters avg {(time.perf_counter()-t0)*1e4:.2f} us'); m.close()"
          fi

      - name: Upload Clean v8.0 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v8-release
          if-no-files-found: warn
          path: |
            transformer.bin
            transformer_brain.bin
            transformer_brain.bin.axn3
            llama_block.bin
            llama_block.bin.axn3
            llama_block.so
            llama_block.so.axn3
            llama_block_client.py