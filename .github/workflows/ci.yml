name: Axon v8.0 Auto-Upgrade & Enterprise Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-axon-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools & llvmlite
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make || true
          sudo apt-get install -y iverilog || echo "[warn] iverilog skipped"
          python3 -m pip install --upgrade pip
          if python3 -m pip install "llvmlite>=0.40,<0.45"; then
            echo "llvm_ok=true" >> "$GITHUB_OUTPUT"
          elif python3 -m pip install --only-binary=:all: llvmlite; then
            echo "llvm_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "llvm_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack v7 base & Auto-Upgrade to Axon v8.0
        run: |
          python3 - <<'PY'
          import os, re, textwrap

          bundle = next((f for f in ("axon_bundle.py", "axon_v7.py", "bundle.py") if os.path.isfile(f)), None)
          if bundle:
              ns = {}
              src = open(bundle, encoding="utf-8").read().split("def main():")[0]
              exec(src, ns)
              for p, c in ns["FILES"].items():
                  if os.path.dirname(p): os.makedirs(os.path.dirname(p), exist_ok=True)
                  if p.endswith("Makefile"): c = c.replace("@@", "\t")
                  open(p, "w", encoding="utf-8").write(c)

          def patch(path, fn):
              s = open(path, encoding="utf-8").read()
              ns = fn(s)
              if ns != s:
                  open(path, "w", encoding="utf-8").write(ns)

          patch("axon/__init__.py", lambda s: '__version__ = "8.0.0"\n')

          def up_fe(s):
              if '"rmsnorm":2' not in s:
                  s = s.replace('"layernorm":3,', '"layernorm":3,"rmsnorm":2,"rope":1,"attn_causal":3,')
                  extra_sem = (
                      '        elif c=="rope":\n'
                      '            if len(a[0].shape)!=2 or a[0].shape[1]%2!=0: self._err("rope requires 2-D [seq, even_dim]",e.loc)\n'
                      '            sh=list(a[0].shape)\n'
                      '        elif c=="attn_causal":\n'
                      '            if len(a[0].shape)!=2 or a[0].shape!=a[1].shape or a[0].shape!=a[2].shape: self._err("attn_causal requires matching 2-D",e.loc)\n'
                      '            sh=list(a[0].shape)\n'
                      '        elif c=="rmsnorm":\n'
                      '            if a[1].shape!=[a[0].shape[-1]]: self._err("rmsnorm gamma mismatch",e.loc)\n'
                      '            sh=list(a[0].shape)\n'
                  )
                  s = s.replace('        elif c in ("layernorm","equilibrium"):', extra_sem + '        elif c in ("layernorm","equilibrium"):')
              return s
          patch("axon/frontend.py", up_fe)

          def up_ir(s):
              if "RMSNORM=auto()" not in s:
                  s = s.replace("LAYERNORM=auto();", "LAYERNORM=auto(); RMSNORM=auto(); ROPE=auto(); ATTN_CAUSAL=auto();")
                  s = s.replace('"layernorm":OpKind.LAYERNORM,', '"layernorm":OpKind.LAYERNORM,"rmsnorm":OpKind.RMSNORM,"rope":OpKind.ROPE,"attn_causal":OpKind.ATTN_CAUSAL,')
              return s
          patch("axon/ir.py", up_ir)

          def up_ref(s):
              if "def _rms(" not in s:
                  fns = textwrap.dedent('''\
                      def _rms(x,g):
                          cols=x.shape[-1]; rows=x.numel()//cols; out=T(x.shape,[0.0]*x.numel())
                          for r in range(rows):
                              row=x.data[r*cols:(r+1)*cols]; inv=1.0/math.sqrt(sum(v*v for v in row)/cols+1e-5)
                              out.data[r*cols:(r+1)*cols]=[(row[j]*inv)*g.data[j] for j in range(cols)]
                          return out
                      def _rope(x):
                          S,D=x.shape; out=T([S,D],[0.0]*(S*D))
                          for p in range(S):
                              for k in range(D//2):
                                  th=p*(10000.0**(-2.0*k/D)); c,s=math.cos(th),math.sin(th)
                                  x0,x1=x.data[p*D+2*k],x.data[p*D+2*k+1]
                                  out.data[p*D+2*k]=x0*c-x1*s; out.data[p*D+2*k+1]=x0*s+x1*c
                          return out
                      def _attn_causal(q,k,v):
                          S,D=q.shape; inv=1.0/math.sqrt(D); out=T([S,D],[0.0]*(S*D))
                          for i in range(S):
                              sc=[sum(q.data[i*D+d]*k.data[j*D+d] for d in range(D))*inv for j in range(i+1)]
                              mx=max(sc); ex=[math.exp(z-mx) for z in sc]; sm=sum(ex)
                              for d in range(D): out.data[i*D+d]=sum((ex[j]/sm)*v.data[j*D+d] for j in range(i+1))
                          return out
                  ''')
                  s = s.replace("def _transpose(t):", fns + "def _transpose(t):")
                  s = s.replace(
                      "elif n.op==OpKind.LAYERNORM: r=_ln(a[0],a[1],a[2])",
                      "elif n.op==OpKind.LAYERNORM: r=_ln(a[0],a[1],a[2])\n"
                      "        elif n.op==OpKind.RMSNORM: r=_rms(a[0],a[1])\n"
                      "        elif n.op==OpKind.ROPE: r=_rope(a[0])\n"
                      "        elif n.op==OpKind.ATTN_CAUSAL: r=_attn_causal(a[0],a[1],a[2])"
                  )
              return s
          patch("axon/reference.py", up_ref)

          def up_h(s):
              if "axon_rms_norm(" not in s:
                  decls = (
                      "int axon_rms_norm(const AxonTensor *X, const AxonTensor *G, AxonTensor *C);\n"
                      "int axon_rope(const AxonTensor *X, AxonTensor *C);\n"
                      "int axon_attn_causal(const AxonTensor *Q, const AxonTensor *K, const AxonTensor *V, AxonTensor *C);\n"
                      "int64_t axon_get_output_numel(void);\n"
                  )
                  head, tail = s.rsplit("#ifdef __cplusplus", 1)
                  s = head + decls + "#ifdef __cplusplus" + tail
              return s
          patch("axon/runtime/axon_runtime.h", up_h)

          def up_c(s):
              old_wt = '    int64_t total=1; for(int64_t i=0;i<ent.ndim;++i){ if(ent.shape[i]<=0)return NULL; total*=ent.shape[i]; }'
              new_wt = '    int64_t shp[AXON_MAX_DIMS]={0}; memcpy(shp,ent.shape,sizeof(shp)); int64_t nd=(int64_t)ent.ndim;\n    int64_t total=1; for(int64_t i=0;i<nd;++i){ if(shp[i]<=0)return NULL; total*=shp[i]; }'
              if old_wt in s:
                  s = s.replace(old_wt, new_wt)
                  s = s.replace('tensor_view_new(ent.ndim,ent.shape,', 'tensor_view_new(nd,shp,')
                  s = s.replace('int sorted=(ent.ndim==2)?1:0;', 'int sorted=(nd==2)?1:0;')
                  s = s.replace('int64_t N=ent.shape[1]', 'int64_t N=shp[1]')
              if "axon_rms_norm(" not in s:
                  kernels = textwrap.dedent('''\
                      int axon_rms_norm(const AxonTensor*X,const AxonTensor*G,AxonTensor*C){
                          REQ(X&&C&&X->data&&C->data,AXON_ERR_ARG); REQ(X->dtype==AXON_DTYPE_F32&&C->dtype==AXON_DTYPE_F32&&X->ndim>=1&&X->ndim==C->ndim,AXON_ERR_DTYPE);
                          for(int64_t i=0;i<X->ndim;++i)REQ(X->shape[i]==C->shape[i],AXON_ERR_SHAPE);
                          const int64_t cols=X->shape[X->ndim-1]; REQ(cols>0,AXON_ERR_SHAPE);
                          int64_t rows=1; for(int64_t i=0;i<X->ndim-1;++i)rows*=X->shape[i];
                          const float*g=NULL; if(G){REQ(G->data&&G->ndim==1&&G->shape[0]==cols&&G->dtype==AXON_DTYPE_F32,AXON_ERR_SHAPE);g=(const float*)G->data;}
                          const float*x=(const float*)X->data; float*c=(float*)C->data;
                          #pragma omp parallel for schedule(static) if(rows*cols>=AXON_PAR_MIN)
                          for(int64_t r=0;r<rows;++r){ const float*xr=x+r*cols; float*yr=c+r*cols; float ms=0.f;
                              for(int64_t j=0;j<cols;++j)ms+=xr[j]*xr[j];
                              float inv=1.f/sqrtf(ms/(float)cols+LN_EPS);
                              for(int64_t j=0;j<cols;++j)yr[j]=(xr[j]*inv)*(g?g[j]:1.f);
                          }
                          return AXON_OK;
                      }
                      int axon_rope(const AxonTensor*X,AxonTensor*C){
                          REQ(X&&C&&X->data&&C->data,AXON_ERR_ARG); REQ(X->ndim==2&&C->ndim==2&&X->dtype==AXON_DTYPE_F32&&C->dtype==AXON_DTYPE_F32,AXON_ERR_SHAPE);
                          const int64_t S=X->shape[0],D=X->shape[1]; REQ(S>0&&D>0&&(D%2)==0&&C->shape[0]==S&&C->shape[1]==D,AXON_ERR_SHAPE);
                          const float*x=(const float*)X->data; float*c=(float*)C->data;
                          #pragma omp parallel for schedule(static) if(S*D>=AXON_PAR_MIN)
                          for(int64_t p=0;p<S;++p)for(int64_t k=0;k<D/2;++k){
                              float th=(float)p*powf(10000.f,-2.f*(float)k/(float)D), cs=cosf(th), sn=sinf(th);
                              float x0=x[p*D+2*k], x1=x[p*D+2*k+1];
                              c[p*D+2*k]=x0*cs-x1*sn; c[p*D+2*k+1]=x0*sn+x1*cs;
                          }
                          return AXON_OK;
                      }
                      int axon_attn_causal(const AxonTensor*Q,const AxonTensor*K,const AxonTensor*V,AxonTensor*C){
                          REQ(Q&&K&&V&&C&&Q->data&&K->data&&V->data&&C->data,AXON_ERR_ARG);
                          REQ(Q->ndim==2&&K->ndim==2&&V->ndim==2&&C->ndim==2,AXON_ERR_SHAPE);
                          REQ(Q->dtype==AXON_DTYPE_F32&&K->dtype==AXON_DTYPE_F32&&V->dtype==AXON_DTYPE_F32&&C->dtype==AXON_DTYPE_F32,AXON_ERR_DTYPE);
                          const int64_t S=Q->shape[0],D=Q->shape[1];
                          REQ(S>0&&D>0&&K->shape[0]==S&&K->shape[1]==D&&V->shape[0]==S&&V->shape[1]==D&&C->shape[0]==S&&C->shape[1]==D,AXON_ERR_SHAPE);
                          const float*q=(const float*)Q->data,*k=(const float*)K->data,*v=(const float*)V->data; float*c=(float*)C->data;
                          const float inv=1.f/sqrtf((float)D);
                          #pragma omp parallel for schedule(static) if(S*S*D>=AXON_PAR_MIN)
                          for(int64_t i=0;i<S;++i){
                              const float*qi=q+i*D; float*ci=c+i*D; for(int64_t d=0;d<D;++d)ci[d]=0.f;
                              float m=-INFINITY, l=0.f;
                              for(int64_t j=0;j<=i;++j){
                                  const float*kj=k+j*D,*vj=v+j*D; float dot=0.f; for(int64_t d=0;d<D;++d)dot+=qi[d]*kj[d];
                                  float sc=dot*inv, mn=(sc>m)?sc:m, alpha=(m==-INFINITY)?0.f:expf(m-mn), beta=expf(sc-mn);
                                  for(int64_t d=0;d<D;++d)ci[d]=ci[d]*alpha+beta*vj[d];
                                  l=l*alpha+beta; m=mn;
                              }
                              float il=(l>0.f)?(1.f/l):0.f; for(int64_t d=0;d<D;++d)ci[d]*=il;
                          }
                          return AXON_OK;
                      }
                  ''')
                  s = s.replace("int axon_equilibrium(", kernels + "\nint axon_equilibrium(")
              return s
          patch("axon/runtime/axon_runtime.c", up_c)

          def up_be(s):
              s = re.sub(
                  r'(?<!self\.f_init=)\bfn=ir\.Function\(self\.mod,ir\.FunctionType\(self\.i32,\[\]\),"axon_init"\)',
                  r'self.f_init=fn=ir.Function(self.mod,ir.FunctionType(self.i32,[]),"axon_init")',
                  s,
              )
              s = s.replace('(K=%0d)', '(K=%%0d)')
              s = s.replace('tm=target.create_target_machine(opt=3)', "tm=target.create_target_machine(opt=3, reloc='pic')")
              if "OpKind.RMSNORM" not in s:
                  s = s.replace(
                      'OpKind.LAYERNORM:(self._f("axon_layer_norm",i32,b4),3),',
                      'OpKind.LAYERNORM:(self._f("axon_layer_norm",i32,b4),3),'
                      'OpKind.RMSNORM:(self._f("axon_rms_norm",i32,b3),2),'
                      'OpKind.ROPE:(self._f("axon_rope",i32,[p,p]),1),'
                      'OpKind.ATTN_CAUSAL:(self._f("axon_attn_causal",i32,b4),3),'
                  )
              if "axon_get_output_numel" not in s:
                  s = s.replace(
                      'f=ir.Function(self.mod,ir.FunctionType(self.i64,[]),"axon_get_input_numel"); ir.IRBuilder(f.append_basic_block("e")).ret(ir.Constant(self.i64,n))',
                      'f=ir.Function(self.mod,ir.FunctionType(self.i64,[]),"axon_get_input_numel"); ir.IRBuilder(f.append_basic_block("e")).ret(ir.Constant(self.i64,n))\n'
                      '        on=_numel(g.get(g.outputs[0]).shape)\n'
                      '        f=ir.Function(self.mod,ir.FunctionType(self.i64,[]),"axon_get_output_numel"); ir.IRBuilder(f.append_basic_block("e")).ret(ir.Constant(self.i64,on))'
                  )
              if "link_shared" not in s:
                  ls = (
                      '    @staticmethod\n'
                      '    def link_shared(objects,out_so,target="",native=False,omp=None):\n'
                      '        from .tools import Inspector\n'
                      '        if omp is None: omp=Inspector.shared().omp_ldflags if not target else ["-fopenmp"]\n'
                      '        cmd=[_tool("cc",target),"-O1" if _san_flags() else "-O3","-shared","-fPIC","-pthread",*_san_flags(),*omp,*objects,"-lm","-o",out_so]\n'
                      '        r=subprocess.run(cmd,capture_output=True,text=True)\n'
                      '        if r.returncode!=0: raise CodegenError("shared link failed:\\n"+r.stderr.strip())\n'
                      '        os.chmod(out_so,0o755); return out_so\n'
                  )
                  s = s.replace("class LLVMBackend:", ls + "\nclass LLVMBackend:")
              if "emit_shared=False" not in s:
                  py_client = (
                      '    PY_CLIENT=(\n'
                      '        \'"""Zero-PyTorch Python FFI client."""\\n\'\n'
                      '        \'import ctypes, os\\n\'\n'
                      '        \'class _AxonTensor(ctypes.Structure):\\n\'\n'
                      '        \'    _fields_=[("data",ctypes.c_void_p),("ndim",ctypes.c_int64),("shape",ctypes.c_int64*4),("strides",ctypes.c_int64*4),("dtype",ctypes.c_int32),("reserved",ctypes.c_int32),("scale",ctypes.c_float),("owns_data",ctypes.c_bool),("in_arena",ctypes.c_bool)]\\n\'\n'
                      '        \'class AxonModel:\\n\'\n'
                      '        \'    def __init__(self, so_path=None, weights_path=None, arena_mb=64):\\n\'\n'
                      '        \'        here=os.path.dirname(os.path.abspath(__file__)); self.so_path=so_path or os.path.join(here,"%s"); self.lib=ctypes.CDLL(os.path.abspath(self.so_path))\\n\'\n'
                      '        \'        self.lib.axon_arena_init.argtypes=[ctypes.c_size_t]; self.lib.axon_arena_reset.argtypes=[]; self.lib.axon_arena_destroy.argtypes=[]\\n\'\n'
                      '        \'        self.lib.axon_load_weights_file.argtypes=[ctypes.c_char_p]; self.lib.axon_load_weights_file.restype=ctypes.c_int; self.lib.axon_unload_weights_file.argtypes=[]\\n\'\n'
                      '        \'        self.lib.axon_get_input_ndim.restype=ctypes.c_int64; self.lib.axon_get_input_shape.argtypes=[ctypes.POINTER(ctypes.c_int64)]\\n\'\n'
                      '        \'        self.lib.axon_get_input_numel.restype=ctypes.c_int64; self.lib.axon_get_output_numel.restype=ctypes.c_int64; self.lib.axon_output_is_temp.restype=ctypes.c_int64\\n\'\n'
                      '        \'        self.lib.axon_tensor_alloc_persistent.argtypes=[ctypes.c_int64,ctypes.POINTER(ctypes.c_int64),ctypes.c_int32]; self.lib.axon_tensor_alloc_persistent.restype=ctypes.c_void_p\\n\'\n'
                      '        \'        self.lib.axon_tensor_fill_f32.argtypes=[ctypes.c_void_p,ctypes.POINTER(ctypes.c_float),ctypes.c_int64]; self.lib.axon_tensor_fill_f32.restype=ctypes.c_int; self.lib.axon_tensor_free.argtypes=[ctypes.c_void_p]\\n\'\n'
                      '        \'        self.lib.axon_forward.argtypes=[ctypes.POINTER(ctypes.c_void_p)]; self.lib.axon_forward.restype=ctypes.POINTER(_AxonTensor); self.lib.axon_shutdown.argtypes=[]\\n\'\n'
                      '        \'        wp=weights_path or (self.so_path+".axn3")\\n\'\n'
                      '        \'        if os.path.exists(wp) and self.lib.axon_load_weights_file(wp.encode())!=0: raise RuntimeError(f"failed mmap {wp}")\\n\'\n'
                      '        \'        if arena_mb>0: self.lib.axon_arena_init(arena_mb*1024*1024)\\n\'\n'
                      '        \'        self.ndim=self.lib.axon_get_input_ndim(); self.cshape=(ctypes.c_int64*self.ndim)(); self.lib.axon_get_input_shape(self.cshape)\\n\'\n'
                      '        \'        self.in_numel=self.lib.axon_get_input_numel(); self.out_numel=self.lib.axon_get_output_numel(); self.inp=self.lib.axon_tensor_alloc_persistent(self.ndim,self.cshape,0)\\n\'\n'
                      '        \'    def infer(self, values):\\n\'\n'
                      '        \'        if len(values)!=self.in_numel: raise ValueError(f"expected {self.in_numel}, got {len(values)}")\\n\'\n'
                      '        \'        arr=(ctypes.c_float*self.in_numel)(*values); self.lib.axon_tensor_fill_f32(self.inp,arr,self.in_numel); self.lib.axon_arena_reset()\\n\'\n'
                      '        \'        inps=(ctypes.c_void_p*1)(self.inp); out=self.lib.axon_forward(inps)\\n\'\n'
                      '        \'        if not out: raise RuntimeError("axon_forward failed")\\n\'\n'
                      '        \'        res=list((ctypes.c_float*self.out_numel).from_address(out.contents.data))\\n\'\n'
                      '        \'        if self.lib.axon_output_is_temp(): self.lib.axon_tensor_free(out)\\n\'\n'
                      '        \'        return res\\n\'\n'
                      '        \'    def close(self):\\n\'\n'
                      '        \'        if getattr(self,"inp",None): self.lib.axon_tensor_free(self.inp); self.inp=None\\n\'\n'
                      '        \'        self.lib.axon_shutdown(); self.lib.axon_arena_destroy(); self.lib.axon_unload_weights_file()\\n\'\n'
                      '        \'    def __enter__(self): return self\\n\'\n'
                      '        \'    def __exit__(self,*_): self.close()\\n\'\n'
                      '    )\n'
                      '    def bake(self,objects,weights,output,emit_lib=False,emit_shared=False,external_weights=False):'
                  )
                  s = s.replace('    def bake(self,objects,weights,output,emit_lib=False,external_weights=False):', py_client)
                  s = s.replace(
                      'with open(output+".axn3","wb") as wf: wf.write(blob)',
                      'ax_t=(output if output.endswith(".so") else output+".so")+".axn3" if emit_shared else output+".axn3"\n                with open(ax_t,"wb") as wf: wf.write(blob)'
                  )
                  shared_branch = (
                      '            if emit_shared:\n'
                      '                so=output if output.endswith(".so") else output+".so"\n'
                      '                Linker.link_shared([*objects,wobj,str(rt.core_obj)],so,self.target,self.native)\n'
                      '                open(so[:-3]+"_client.py","w").write(self.PY_CLIENT%os.path.basename(so))\n'
                      '                return so\n'
                  )
                  s = s.replace(
                      '            Linker.link([*objects,wobj,str(rt.main_obj)],output,str(rt.static_lib),self.target,self.native); return output',
                      shared_branch + '            Linker.link([*objects,wobj,str(rt.main_obj)],output,str(rt.static_lib),self.target,self.native); return output'
                  )
              return s
          patch("axon/backend.py", up_be)

          def up_tools(s):
              if "def graph_from_safetensors" not in s:
                  meth = textwrap.indent(textwrap.dedent('''\
                      @staticmethod
                      def graph_from_safetensors(path,transpose=False):
                          from .ir import Graph, IRNode, OpKind, WeightBlob
                          t=Safetensors.load(path); prefix=Converter._find_prefix(t)
                          if prefix is None: raise AxonError("no layer weights found")
                          g=Graph(); nid=0
                          def fresh():
                              nonlocal nid
                              i=nid; nid+=1; return i
                          w0=t[f"{prefix}0.weight"]; r0,c0=w0["shape"]; in_dim=c0 if transpose else r0
                          cur=fresh(); g.nodes.append(IRNode(cur,OpKind.INPUT,[],{"param":"x"},(1,in_dim),"f32","x")); g.inputs.append(cur)
                          idx=0
                          while f"{prefix}{idx}.weight" in t:
                              wt=t[f"{prefix}{idx}.weight"]; r,c=wt["shape"]; data=list(wt["data"])
                              if transpose: flat=[data[i*c+j] for j in range(c) for i in range(r)]; k,n=c,r
                              else: flat=data; k,n=r,c
                              wn=f"l{idx}_w"; wi=fresh(); g.weights[wn]=WeightBlob(wn,flat,[k,n],"f32")
                              g.nodes.append(IRNode(wi,OpKind.CONSTANT,[],{"weight":wn},(k,n),"f32",wn))
                              mm=fresh(); g.nodes.append(IRNode(mm,OpKind.MATMUL,[cur,wi],{},(1,n),"f32",f"mm{idx}")); cur=mm
                              bt=t.get(f"{prefix}{idx}.bias")
                              if bt is not None:
                                  bn=f"l{idx}_b"; bi=fresh(); g.weights[bn]=WeightBlob(bn,list(bt["data"]),[n],"f32")
                                  g.nodes.append(IRNode(bi,OpKind.CONSTANT,[],{"weight":bn},(n,),"f32",bn))
                                  ad=fresh(); g.nodes.append(IRNode(ad,OpKind.ADD,[cur,bi],{},(1,n),"f32",f"add{idx}")); cur=ad
                              act=t.get(f"{prefix}{idx}.act")
                              if act is not None:
                                  code=int(act["data"][0]) if len(act["data"]) else 0
                                  op={0:OpKind.RELU,1:OpKind.GELU,2:OpKind.SOFTMAX,3:OpKind.SILU,4:OpKind.SIGMOID}.get(code,OpKind.RELU)
                                  ac=fresh(); g.nodes.append(IRNode(ac,op,[cur],{},(1,n),"f32",f"act{idx}")); cur=ac
                              idx+=1
                          g.outputs.append(cur); g.reindex(); return g
                  '''), "    ")
                  s = s.replace("EVOLVE_SRC=", meth + "\nEVOLVE_SRC=")
              return s
          patch("axon/tools.py", up_tools)

          def up_cli(s):
