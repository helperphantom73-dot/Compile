                      'pb.add_argument("--native",action="store_true"); pb.add_argument("--emit-lib",action="store_true"); pb.add_argument("--emit-shared",action="store_true"); pb.add_argument("--emit-silicon",action="store_true")'
                  )
                  s = s.replace(
                      'Baker(target=args.target,native=args.native).bake([obj],g.weights,args.output,emit_lib=args.emit_lib,external_weights=args.external_weights)',
                      'Baker(target=args.target,native=args.native).bake([obj],g.weights,args.output,emit_lib=args.emit_lib,emit_shared=args.emit_shared,external_weights=args.external_weights)'
                  )
                  s = s.replace(
                      "kind='library' if args.emit_lib else ('binary + mmap .axn3' if args.external_weights else 'binary')",
                      "kind='shared .so + client' if args.emit_shared else ('library' if args.emit_lib else ('binary + mmap .axn3' if args.external_weights else 'binary'))"
                  )
                  s = s.replace(
                      'model=Converter.from_safetensors(args.weights,args.transpose)',
                      'g=Pipeline(quant=not getattr(args,"no_quant",False),ternary=args.ternary,brain=args.brain).run(Converter.graph_from_safetensors(args.weights,args.transpose))\n'
                      '        ensure_runtime(native=args.native); obj=args.output+".gen.o"\n'
                      '        try:\n'
                      '            LLVMBackend(target_triple=args.target).compile(g,obj)\n'
                      '            Baker(target=args.target,native=args.native).bake([obj],g.weights,args.output,external_weights=args.external_weights)\n'
                      '        finally:\n'
                      '            if os.path.exists(obj): os.remove(obj)\n'
