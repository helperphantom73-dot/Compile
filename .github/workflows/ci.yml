                  "            int64_t t1[1] = {1};\n"
                  "            AxonTensor *t = axon_tensor_alloc(1, t1, AXON_DTYPE_F32);\n"
                  "            if (!t) { for (int j=0;j<i;++j) axon_tensor_free(vals[j]); free(vals); axon_arena_destroy(); return AXON_ERR_NOMEM; }\n"
                  "            if (t->owns_data) { studio_aligned_free(t->data); t->owns_data = false; }\n"
                  "            t->ndim = cw->ndim;\n"
                  "            memset(t->shape, 0, sizeof(t->shape)); memset(t->strides, 0, sizeof(t->strides));\n"
                  "            int64_t st_v = 1;\n"
                  "            for (int d = cw->ndim - 1; d >= 0; --d) { t->shape[d] = cw->shape[d]; t->strides[d] = st_v; st_v *= cw->shape[d]; }\n"
                  "            int is_axg = (strcmp(m->format, \"axg1+axn3\") == 0);\n"
                  "            int want_fp4 = is_axg ? (cw->native_dtype == AXON_DTYPE_FP4) : use_fp4;\n"
                  "            int want_tern = is_axg ? (cw->native_dtype == AXON_DTYPE_TERNARY) : use_tern;\n"
                  "            if (want_fp4 && cw->fp4_buf && cw->ndim == 2 && !use_gpu) {",
              ),
              ("} else if (use_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {", "} else if (want_tern && cw->tern_buf && cw->ndim == 2 && !use_gpu) {"),
              (
                  "                AxonTensor *S = axon_tensor_alloc(2, sshp, AXON_DTYPE_F32);\n"
                  "                S->data = cw->sig_data; S->owns_data = false;\n"
                  "                AxonTensor *W_reg = axon_tensor_alloc(2, cw->shape, AXON_DTYPE_F32);\n"
                  "                W_reg->data = cw->reg_data; W_reg->owns_data = false;\n"
                  "                rc = axon_neuro_matmul_paged(a0, W_reg, S, out, (int32_t)cw->keep, 1);",
