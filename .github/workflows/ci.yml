
name: Axon v11.0 Universal Cross-OS & Enterprise CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  linux-universal-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Toolchain, OpenCL (PoCL), Verilog & llvmlite
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make iverilog ocl-icd-opencl-dev pocl-opencl-icd clinfo
          python3 -m pip install --upgrade pip
          python3 -m pip install "llvmlite>=0.40,<0.45"
          clinfo || true

      - name: Unpack v10 & Auto-Upgrade to Axon v11.0
        run: |
          python3 axon_v11_upgrade.py

      - name: Hardware AutoConfig & Full Selfcheck (Tests + TPU MLIR + OpenCL + Verilog)
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 -m axon.cli autoconfig
          python3 -m axon.cli selfcheck

      - name: Enterprise One-Command Deploy (FP4 + Brain + Zero-PyTorch FFI + TPU + GPU)
        run: |
          python3 -m axon.cli deploy examples/mini_llm.axon -o dist_linux/mini_llm --gpu
          ./dist_linux/mini_llm/mini_llm.bin --generate 8
          ./dist_linux/mini_llm/mini_llm_gpu.bin --generate 4
          python3 -m axon.cli build examples/transformer_block.axon -o transformer_brain.bin --brain --external-weights --target auto
          python3 -m axon.cli build examples/llama_block.axon -o llama_block.so --emit-shared --external-weights
          python3 -m axon.cli build examples/transformer_block.axon -o axon_chip.v --emit-silicon

      - name: Run ASan + UBSan Sanitizer Suite
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          make sanitize
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -m axon.cli autoconfig --no-tune

      - name: Run v11.0 Multi-Backend Benchmarks & Step Summary Chart
        run: |
          python3 tests/bench_chart.py --require-opencl
          ./transformer_brain.bin --iters 50
          ./dist_linux/mini_llm/mini_llm.bin --iters 50

      - name: Upload Axon v11.0 Linux Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v11-linux-x86_64
          if-no-files-found: warn
          path: |
            dist_linux/
            transformer_brain.bin
            transformer_brain.bin.axn3
            llama_block.so
            llama_block.so.axn3
            llama_block_client.py
            axon_chip.v
            axon_chip_tb.v
            axon_chip_weights.hex
            bench_results.md
            bench_results.json

  cross-os-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure C Compiler & llvmlite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            if ! command -v gcc >/dev/null 2>&1; then
              choco install mingw -y
              export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/bin:$PATH"
              echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
            fi
          fi
          python -m pip install --upgrade pip
          python -m pip install "llvmlite>=0.40,<0.45"

      - name: Build & Verify Axon v11.0 on ${{ matrix.os }}
        shell: bash
        run: |
          python axon_v11_upgrade.py
          python -m axon.cli autoconfig --no-tune
          python -m axon.cli deploy examples/mini_llm.axon -o "dist_${{ runner.os }}/mini_llm"
          if [ "${{ runner.os }}" = "Windows" ]; then
            "./dist_${{ runner.os }}/mini_llm/mini_llm.exe" --generate 6
          else
            "./dist_${{ runner.os }}/mini_llm/mini_llm.bin" --generate 6
          fi

      - name: Upload ${{ matrix.os }} Enterprise Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axon-v11-${{ matrix.os }}
          if-no-files-found: warn
          path: dist_${{ runner.os }
