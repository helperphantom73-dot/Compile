          python3 axon_v12_studio.py
          python3 -m axon.cli export-axg examples/mini_llm.axon -o dist_v12/mini_llm --brain
          python3 -m axon.cli build-mobile -o dist_mobile_android
          ls -lh dist_v12/ dist_mobile_android/

      - name: Verify Zero-Prerequisite Execution in Empty Temp Folder (No Python/LLVM needed)
        run: |
          mkdir -p /tmp/zero_req_free /tmp/zero_req_pro
          cp dist_v12/axon-studio dist_v12/mini_llm.axg1 dist_v12/mini_llm.axn3 /tmp/zero_req_free/
          cp dist_v12/axon-pro-studio dist_v12/mini_llm.axg1 dist_v12/mini_llm.axn3 /tmp/zero_req_pro/
          /tmp/zero_req_free/axon-studio --once
          /tmp/zero_req_free/axon-studio --axg /tmp/zero_req_free/mini_llm.axg1 --axn /tmp/zero_req_free/mini_llm.axn3 --once
          /tmp/zero_req_pro/axon-pro-studio --once
          /tmp/zero_req_pro/axon-pro-studio --axg /tmp/zero_req_pro/mini_llm.axg1 --axn /tmp/zero_req_pro/mini_llm.axn3 --once
          rm -rf /tmp/zero_req_free /tmp/zero_req_pro

      - name: Selfcheck, Sanitizer (ASan+UBSan) & Multi-Backend Benchmarks
        env:
          AXON_REQUIRE_OPENCL: "1"
        run: |
          python3 -m axon.cli selfcheck
          make sanitize
          rm -f axon/runtime/*.o axon/runtime/*.a axon/runtime/*.so axon/runtime/.axon_tuning_stamp
          python3 -m axon.cli autoconfig --no-tune
          python3 tests/bench_chart.py --require-opencl

      - name: Upload Axon Free (Linux)
