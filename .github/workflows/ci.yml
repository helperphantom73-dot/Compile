               "if (now >= qs.week_start && (now - qs.week_start) >= AXON_WEEK_SEC) { qs.week_start = now; qs.active_sec = 0.0; }"),
              ("uint8_t hdr[56]; if (fread(hdr, 1, 56, fg) != 56", "uint8_t hdr[60]; if (fread(hdr, 1, 60, fg) != 60"),
