                  "                    if (S->owns_data) { studio_aligned_free(S->data); S->owns_data = false; }\n"
                  "                    if (W_reg->owns_data) { studio_aligned_free(W_reg->data); W_reg->owns_data = false; }\n"
                  "                    S->ndim = 2; S->shape[0] = sshp[0]; S->shape[1] = sshp[1]; S->strides[0] = sshp[1]; S->strides[1] = 1;\n"
